# ---------------------------------------------------------------------------
# iStoreOS 24.10 for the JLC RK3568 8125 custom board (RTL8125 2.5GbE)
#
# Everything (source, feeds, downloads) is fetched on GitHub's runner, so the
# build does NOT depend on your local network at all. Your machine only needs
# to be able to push this small kit to GitHub once.
#
# Trigger: push to main/master, or Actions -> "Run workflow".
# Output : artifact "istoreos-jlc-firmware" containing
#          istoreos-rockchip-armv8-jlc_rk3568_8125-squashfs-sysupgrade.img.gz
# ---------------------------------------------------------------------------
name: Build iStoreOS - JLC RK3568 8125

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'iStoreOS source branch'
        required: true
        default: 'istoreos-24.10'
      jobs:
        description: 'make -jN (free runner: 2 vCPU / 7 GB RAM; 2 is safest, 4 needs RAM)'
        required: true
        default: '2'
      runner:
        description: 'Runner image (switch to ubuntu-24.04 if 22.04 is retired)'
        required: true
        default: 'ubuntu-22.04'
      make_release:
        description: 'Also publish firmware to Releases (artifacts expire in 90 days)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      extra_packages:
        description: 'Optional extra packages, space separated, e.g. "luci-app-upnp htop"'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'board/**'
      - 'config.seed'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  TZ: Asia/Shanghai

concurrency:
  group: istoreos-jlc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 350

    env:
      BRANCH: ${{ github.event.inputs.branch || 'istoreos-24.10' }}
      JOBS: ${{ github.event.inputs.jobs || '2' }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}

    steps:
      # Free GitHub-hosted runners only expose ~14 GB; an OpenWrt build needs
      # 40 GB+. This action merges / and /mnt into one ~90 GB volume.
      # continue-on-error so the manual cleanup below still saves the job if
      # the action ever breaks on a newer runner image.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        continue-on-error: true
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout this kit
        uses: actions/checkout@v4

      - name: Free disk space + report
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /etc/mysql /etc/php /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean || true
          df -hT
          echo "BRANCH=$BRANCH  JOBS=$JOBS  runner=$(uname -m)  cores=$(nproc)"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3-pyelftools swig rsync unzip zlib1g-dev file \
            wget libelf-dev xz-utils liblzma-dev libzstd-dev \
            device-tree-compiler u-boot-tools pkg-config squashfs-tools \
            qemu-utils bc time
          sudo apt-get install -y --no-install-recommends python3-distutils || true

      - name: Pre-validate the board DTS with dtc
        run: |
          dtc --version
          if dtc -I dts -O dtb -o /tmp/jlc-check.dtb board/rk3568-jlc-custom.dts; then
            echo "DTS compiles OK: $(stat -c%s /tmp/jlc-check.dtb) bytes"
          else
            echo "::warning::host dtc rejected the DTS. The kernel ships its own dtc;"
            echo "::warning::the build will still try. Check build.log if the dtb step fails."
          fi

      - name: Clone iStoreOS source
        run: |
          git clone --depth 1 --single-branch -b "$BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "HEAD: $(git log -1 --format='%h %ad %s' --date=short)"
          echo "Kernel: $(grep KERNEL_PATCHVER target/linux/rockchip/Makefile)"
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-${{ env.BRANCH }}-
            dl-

      - name: Inject JLC RK3568 board support
        run: bash scripts/inject.sh openwrt

      - name: Update & install feeds (with retries)
        working-directory: openwrt
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          git config --global http.postBuffer 524288000
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then ok=1; break; fi
            echo "::warning::feeds update attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "::error::feeds update failed 3x"; exit 1; }
          ./scripts/feeds install -a
          echo "store feed installed:"; ls package/feeds/store/ 2>/dev/null || true

      - name: Configure (make defconfig + hard verification)
        working-directory: openwrt
        run: |
          if [ -n "$EXTRA_PACKAGES" ]; then
            for p in $EXTRA_PACKAGES; do
              echo "CONFIG_PACKAGE_$p=y" >> .config
            done
            echo "extra packages: $EXTRA_PACKAGES"
          fi
          make defconfig
          echo "---- resolved target/config ----"
          grep -E '^CONFIG_TARGET_(rockchip|MULTI_PROFILE)|^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_jlc' .config || true
          grep -E '^CONFIG_PACKAGE_(luci|luci-app-store|u-boot-nanopi|kmod-r8169)' .config || true
          # Hard failures: without these the image cannot be produced.
          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_jlc_rk3568_8125=y' .config || {
            echo "::error::device profile was dropped by defconfig"; exit 1; }
          grep -q '^CONFIG_PACKAGE_u-boot-nanopi-r5s-rk3568=y' .config || {
            echo "::error::U-Boot package not selected - pine64-img would fail"; exit 1; }
          # Soft warnings: a missing LuCI / store still yields a bootable image.
          grep -q '^CONFIG_PACKAGE_luci=y' .config || \
            echo "::warning::LuCI not selected; the image will have no web UI"
          grep -q '^CONFIG_PACKAGE_luci-app-store=y' .config || \
            echo "::warning::iStore store not selected (feed may be unavailable)"

      - name: Download package sources (with retries)
        working-directory: openwrt
        run: |
          ok=0
          for i in 1 2 3; do
            if make -j8 download; then ok=1; break; fi
            echo "::warning::make download attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "::error::make download failed 3x"; exit 1; }
          # Drop truncated downloads so they get re-fetched.
          find dl -type f -size -1024c -delete || true
          du -sh dl

      - name: Compile firmware
        id: compile
        working-directory: openwrt
        run: |
          set -o pipefail
          echo "== make -j$JOBS (first full build ~1-3 h) =="
          if ! make -j"$JOBS" V=s 2>&1 | tee build.log; then
            echo "::warning::parallel build failed; retrying single-threaded with V=s"
            echo "==== RETRY -j1 ====" | tee -a build.log
            make -j1 V=s 2>&1 | tee -a build.log
          fi
          echo "---- artifacts found ----"
          find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
            -name '*jlc_rk3568_8125*' -printf '%f  %k KB\n' 2>/dev/null || true
          # Hard-check: fail loudly instead of uploading an empty artifact.
          if ! ls bin/targets/rockchip/armv8/*jlc_rk3568_8125*squashfs-sysupgrade.img.gz \
                 >/dev/null 2>&1; then
            echo "::error::expected sysupgrade image was NOT produced (see build.log)"
            echo "---- last 80 lines of build.log ----"
            tail -80 build.log || true
            exit 1
          fi
          echo "::notice::firmware image produced OK"

      - name: Collect artifacts (always)
        if: always()
        run: |
          mkdir -p artifacts/firmware artifacts/diag
          cp -a openwrt/bin/targets/rockchip/armv8/. artifacts/firmware/ 2>/dev/null || true
          rm -rf artifacts/firmware/packages
          cp -f openwrt/build.log artifacts/diag/ 2>/dev/null || true
          cp -f openwrt/.config artifacts/diag/config.buildinfo 2>/dev/null || true
          cp -f openwrt/feeds.conf.default artifacts/diag/ 2>/dev/null || true
          find openwrt/build_dir -name 'image-*.dtb' \
            -exec cp {} artifacts/diag/ \; 2>/dev/null || true
          echo "---- firmware ----"; ls -lh artifacts/firmware/ || true
          echo "---- diagnostics ----"; ls -lh artifacts/diag/ || true
          df -hT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istoreos-jlc-firmware
          path: artifacts/firmware/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload build diagnostics (log / config / dtb)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istoreos-jlc-diagnostics
          path: artifacts/diag/
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish to Releases
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.make_release == 'true' &&
          steps.compile.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jlc-rk3568-8125-${{ github.run_number }}
          name: iStoreOS JLC RK3568 8125 #${{ github.run_number }}
          body: |
            iStoreOS 24.10 built for the JLC RK3568 8125 custom board (RTL8125 2.5GbE).

            - Flash `*-squashfs-sysupgrade.img.gz` (decompress first) to SD/eMMC.
            - Kernel DTB was decompiled from a 6.12 donor image but rebuilt for 6.6.
            - First boot: use a TTL serial console at 1500000 8N1 and keep
              MaskROM / RKDevTool ready for recovery.
          files: artifacts/firmware/*
          token: ${{ secrets.GITHUB_TOKEN }}
